<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>交互式元素周期表</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0c14;--card:#13131f;--glass:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);--text:#e0e0e8;--text2:#888;
  --alkali:#ff4d6a;--alkaline:#ff8c42;--transition:#f0c040;
  --post-transition:#8bc34a;--metalloid:#66bb6a;--nonmetal:#43a047;
  --halogen:#26c6da;--noble:#7c4dff;--lanthanide:#f48fb1;--actinide:#ce93d8;
  --unknown:#607d8b;
}
html{background:var(--bg);color:var(--text);font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}

/* ===== TOOLBAR ===== */
.toolbar{
  position:sticky;top:0;z-index:100;width:100%;
  background:rgba(12,12,20,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:10px 16px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
}
.search-box{
  background:var(--glass);border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;color:var(--text);font-size:15px;width:220px;outline:none;
  transition:border .2s;
}
.search-box:focus{border-color:rgba(124,77,255,.6)}
.search-box::placeholder{color:#555}
.cat-btns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.cat-btn{
  padding:6px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--glass);color:var(--text);font-size:12px;cursor:pointer;
  min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;white-space:nowrap;
}
.cat-btn:hover,.cat-btn.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.cat-btn .dot{width:10px;height:10px;border-radius:50%;margin-right:5px;flex-shrink:0}

/* temperature slider */
.temp-wrap{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.temp-wrap label{font-size:13px;color:var(--text2);white-space:nowrap}
.temp-slider{width:140px;accent-color:#7c4dff}
.temp-val{font-size:14px;font-weight:700;min-width:55px;text-align:center}

/* ===== TABLE ===== */
.table-scroll{
  width:100%;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:12px 8px 80px;
}
.ptable{
  display:grid;
  grid-template-columns:repeat(18,minmax(58px,1fr));
  gap:3px;margin:0 auto;width:max-content;min-width:100%;
}
/* lanthanide / actinide rows */
.ln-spacer{grid-column:1/-1;height:10px}

/* ===== ELEMENT CELL ===== */
.el{
  position:relative;border-radius:6px;padding:4px 3px 3px;
  border:1px solid var(--border);cursor:pointer;
  backdrop-filter:blur(6px);transition:all .25s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:58px;min-width:54px;
  user-select:none;-webkit-user-select:none;
}
.el:hover{transform:scale(1.12);z-index:10;border-color:rgba(255,255,255,.35)}
.el.glow{box-shadow:0 0 18px 4px var(--glow-color,rgba(124,77,255,.6));border-color:rgba(255,255,255,.5);z-index:10}
.el.dimmed{opacity:.12;pointer-events:none}
.el.highlight{box-shadow:0 0 14px 2px rgba(255,200,0,.5);border-color:rgba(255,200,0,.7)}
.el .num{font-size:9px;color:rgba(255,255,255,.55);position:absolute;top:2px;left:4px}
.el .sym{font-size:17px;font-weight:700;line-height:1.1}
.el .name{font-size:9px;opacity:.8;line-height:1.1}
.el .mass{font-size:8px;color:rgba(255,255,255,.4);line-height:1.1}

/* state indicators */
.el.state-solid .sym{text-decoration:none}
.el.state-liquid .sym{text-decoration:underline;text-decoration-style:wavy;text-underline-offset:2px}
.el.state-gas{animation:gasPulse 2.5s ease-in-out infinite}
.el.state-gas .sym{opacity:.8}
@keyframes gasPulse{0%,100%{opacity:1}50%{opacity:.65}}

/* placeholder for empty grid spots */
.el.empty{visibility:hidden;pointer-events:none;border:none;background:none}
.el.label-cell{background:none!important;border:none!important;cursor:default;font-size:11px;color:var(--text2);backdrop-filter:none}
.el.label-cell:hover{transform:none}

/* colors by category */
.el.alkali-metal{background:rgba(255,77,106,.15);--glow-color:rgba(255,77,106,.5)}
.el.alkaline-earth{background:rgba(255,140,66,.15);--glow-color:rgba(255,140,66,.5)}
.el.transition-metal{background:rgba(240,192,64,.12);--glow-color:rgba(240,192,64,.5)}
.el.post-transition{background:rgba(139,195,74,.13);--glow-color:rgba(139,195,74,.5)}
.el.metalloid{background:rgba(102,187,106,.13);--glow-color:rgba(102,187,106,.5)}
.el.nonmetal{background:rgba(67,160,71,.15);--glow-color:rgba(67,160,71,.5)}
.el.halogen{background:rgba(38,198,218,.15);--glow-color:rgba(38,198,218,.5)}
.el.noble-gas{background:rgba(124,77,255,.18);--glow-color:rgba(124,77,255,.5)}
.el.lanthanide{background:rgba(244,143,177,.13);--glow-color:rgba(244,143,177,.5)}
.el.actinide{background:rgba(206,147,216,.13);--glow-color:rgba(206,147,216,.5)}
.el.unknown{background:rgba(96,125,140,.13);--glow-color:rgba(96,125,140,.5)}

/* ===== DETAIL PANEL ===== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:all}
.detail{
  position:fixed;z-index:210;
  background:rgba(19,19,31,.97);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:16px 16px 0 0;
  padding:24px 20px 30px;
  left:0;right:0;bottom:0;max-height:85vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.detail.show{transform:translateY(0)}
.detail .close-btn{
  position:absolute;top:12px;right:16px;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--border);background:var(--glass);
  color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.detail h2{font-size:28px;margin-bottom:2px}
.detail .sub{color:var(--text2);font-size:14px;margin-bottom:14px}
.detail .props{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:18px}
.detail .props div{font-size:13px}
.detail .props span{color:var(--text2);font-size:11px;display:block}

/* Atom animation */
.atom-wrap{display:flex;justify-content:center;margin:10px 0 6px;position:relative;width:180px;height:180px;margin-left:auto;margin-right:auto}
.nucleus{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#7c4dff 80%);
  box-shadow:0 0 16px 4px rgba(124,77,255,.5);z-index:2;
}
.orbit{
  position:absolute;top:50%;left:50%;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);transform:translate(-50%,-50%);
}
.electron{
  position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#fff,#26c6da);
  box-shadow:0 0 6px 1px rgba(38,198,218,.7);
}

@media(min-width:1100px){
  .detail{
    left:50%;right:auto;bottom:auto;top:50%;
    transform:translate(-50%,-50%) scale(.92);opacity:0;
    border-radius:16px;max-width:480px;width:90%;max-height:80vh;
  }
  .detail.show{transform:translate(-50%,-50%) scale(1);opacity:1}
}

/* ===== LEGEND ===== */
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0;justify-content:center;font-size:11px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-item .swatch{width:14px;height:14px;border-radius:3px}

@media(max-width:600px){
  .ptable{gap:2px}
  .el{min-width:42px;min-height:48px;padding:2px 1px}
  .el .sym{font-size:14px}
  .el .name,.el .mass{font-size:7px}
  .el .num{font-size:7px}
  .search-box{width:160px}
}
</style>
</head>

].forEach(s=>SHELLS[s[0]]=s[1]);

function getShells(z){
  if(SHELLS[z]) return SHELLS[z];
  // approximate shells for heavier elements
  const cfg=[];
  const max=[2,8,18,32,32,18,8];
  let left=z;
  for(let i=0;i<max.length&&left>0;i++){
    const n=Math.min(left,max[i]);
    cfg.push(n);left-=n;
  }
  if(left>0) cfg.push(left);
  return cfg;
}

// ==================== BUILD TABLE ====================
const ptable=document.getElementById('ptable');
const grid={}; // key "row-col" -> element data

E.forEach(el=>{
  const [z,sym,cn,mass,cat,row,col]=el;
  const key=`${row}-${col}`;

});

// rows 1-7 main, then spacer, then 9 (lanthanides), 10 (actinides)
const rows=[1,2,3,4,5,6,7,'spacer',9,10];

// Lanthanide/Actinide placeholder markers
const LA_MARKER={6:57, 7:89};

function createCell(el){
  const [z,sym,cn,mass,cat]=el;
  const d=document.createElement('div');
  d.className=`el ${cat}`;
  d.dataset.z=z;
  d.dataset.cat=cat;

  d.innerHTML=`<span class="num">${z}</span><span class="sym">${sym}</span><span class="name">${cn}</span><span class="mass">${mass}</span>`;

}

// ==================== SEARCH ====================
const searchBox=document.getElementById('searchBox');
searchBox.addEventListener('input',()=>updateFilters());

function updateFilters(){
  const q=searchBox.value.trim().toLowerCase();
  // Update active button style
  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.classList.toggle('active', activeCat===null ? b.textContent==='全部' : b.dataset.cat===activeCat);
  });

  allCells.forEach(cell=>{
    const z=cell.dataset.z, sym=(cell.dataset.sym||'').toLowerCase(), cn=cell.dataset.cn||'';
    const cat=cell.dataset.cat;
    let show=true;
    if(activeCat && cat!==activeCat) show=false;
    let matched=true;
    if(q){
      matched = sym.includes(q) || cn.includes(q) || z===q;
    }
    cell.classList.toggle('dimmed',!show || (q && !matched));
    cell.classList.toggle('highlight',q && matched && show);
  });
}

// ==================== TEMPERATURE SLIDER ====================
const tempSlider=document.getElementById('tempSlider');
const tempVal=document.getElementById('tempVal');

tempSlider.addEventListener('input',()=>{
  const t=+tempSlider.value;
  tempVal.textContent=t+' K';
  applyTemperature(t);
});

function applyTemperature(t){
  allCells.forEach(cell=>{
    const z=+cell.dataset.z;
    const el=E.find(e=>e[0]===z);
    if(!el) return;
    const mp=el[7], bp=el[8];
    cell.classList.remove('state-solid','state-liquid','state-gas');
    if(!mp || mp===0){
      // unknown
      return;
    }
    if(t < mp) cell.classList.add('state-solid');
    else if(bp && bp>0 && t < bp) cell.classList.add('state-liquid');
    else cell.classList.add('state-gas');
  });
}
applyTemperature(298);

// ==================== DETAIL PANEL ====================
const overlay=document.getElementById('overlay');
const detail=document.getElementById('detail');
const detailContent=document.getElementById('detailContent');
const closeBtn=document.getElementById('closeBtn');

function closeDetail(){overlay.classList.remove('show');detail.classList.remove('show')}
overlay.addEventListener('click',closeDetail);
closeBtn.addEventListener('click',closeDetail);

function showDetail(el){
  const [z,sym,cn,mass,cat,row,col,mp,bp,econfig,density,discovered]=el;
  const catInfo=CATEGORIES[cat]||{label:'未知',color:'#666'};
  const shells=getShells(z);

  let html=`<h2 style="color:${catInfo.color}">${sym} <span style="font-size:18px;opacity:.7">${cn}</span></h2>`;
  html+=`<div class="sub">原子序数 ${z} · ${catInfo.label} · ${mass} u</div>`;
  html+=`<div class="props">`;
  if(econfig) html+=`<div><span>电子排布</span>${econfig}</div>`;
  if(density) html+=`<div><span>密度</span>${density>0.1?density+' g/cm³':density+' g/cm³ (气)'}</div>`;
  if(mp) html+=`<div><span>熔点</span>${mp} K</div>`;
  if(bp) html+=`<div><span>沸点</span>${bp} K</div>`;
  if(discovered) html+=`<div><span>发现年份</span>${discovered>0?discovered+'年':'远古已知'}</div>`;
  html+=`<div><span>壳层电子数</span>${shells.join('-')}</div>`;
  html+=`</div>`;
  html+=`<div class="atom-wrap" id="atomWrap"></div>`;

  detailContent.innerHTML=html;
  buildAtomAnimation(shells, catInfo.color);

  overlay.classList.add('show');
  detail.classList.add('show');
}

function buildAtomAnimation(shells, color){
  const wrap=document.getElementById('atomWrap');
  if(!wrap) return;
  wrap.innerHTML='<div class="nucleus"></div>';
  const cx=90,cy=90;
  const maxR=82;
  const n=shells.length;

  shells.forEach((count,i)=>{
    const r=22+(maxR-22)*((i+1)/n);
    // orbit ring
    const orbit=document.createElement('div');
    orbit.className='orbit';
    orbit.style.width=orbit.style.height=r*2+'px';
    wrap.appendChild(orbit);

    // electrons
    for(let j=0;j<Math.min(count,12);j++){
      const electron=document.createElement('div');
      electron.className='electron';
      const angle0=(360/Math.min(count,12))*j;
      const speed=3+i*1.5; // seconds per revolution
      electron.style.cssText=`
        position:absolute;left:${cx}px;top:${cy}px;
        animation:orbit${i}_${j} ${speed}s linear infinite;
      `;
      // Create keyframe
      const kf=`@keyframes orbit${i}_${j}{
        from{transform:rotate(${angle0}deg) translateX(${r}px) rotate(-${angle0}deg)}
        to{transform:rotate(${angle0+360}deg) translateX(${r}px) rotate(-${angle0+360}deg)}
      }`;
      const style=document.createElement('style');
      style.textContent=kf;
      document.head.appendChild(style);
      wrap.appendChild(electron);
    }
  });
}

// Initial temperature display
