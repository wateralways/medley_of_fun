<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>流体模拟</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100%; height: 100%; }
#controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 10px 16px max(10px, env(safe-area-inset-bottom));
  background: rgba(10,10,20,0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,0.08); z-index: 10;
}
.btn {
  min-width: 48px; min-height: 48px; padding: 8px 16px;
  border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
  background: rgba(255,255,255,0.06); color: #ccc;
  font-size: 14px; font-family: system-ui, sans-serif; cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  display: flex; align-items: center; justify-content: center; white-space: nowrap;
}
.btn:hover, .btn:active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
.btn.active { border-color: rgba(120,200,255,0.6); background: rgba(120,200,255,0.12); color: #8cf; }
.slider-wrap {
  display: flex; align-items: center; gap: 6px; color: #888; font-size: 13px; font-family: system-ui, sans-serif;
}
.slider-wrap input[type=range] {
  width: 80px; height: 48px; cursor: pointer;
  accent-color: #6af;
}
#mode-label { font-size: 12px; color: #666; position: absolute; top: -16px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <button class="btn active" id="btn-mode" title="配色模式">霓虹</button>
  <button class="btn" id="btn-clear" title="清除">清除</button>
  <div class="slider-wrap">
    <span>粘度</span>
    <input type="range" id="viscosity" min="0" max="100" value="20">
  </div>
</div>

<script>
"use strict";

// --- WebGL Fluid Simulation (Stable Fluids / Jos Stam approach on GPU) ---

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px;font-size:18px;">需要 WebGL2 支持。</p>'; throw 'No WebGL2'; }

// Check float texture support
const ext1 = gl.getExtension('EXT_color_buffer_float');
const ext2 = gl.getExtension('OES_texture_float_linear');

// --- Config ---
const config = {
  SIM_RES: 128,
  DYE_RES: 1024,
  PRESSURE_ITERATIONS: 20,
  CURL: 30,
  SPLAT_RADIUS: 0.25,
  SPLAT_FORCE: 6000,
  colorMode: 0, // 0=霓虹, 1=火焰, 2=海洋, 3=彩虹
  colorModes: ['霓虹', '火焰', '海洋', '彩虹'],
};

let viscosity = 0.2;

// --- Shader sources ---
const baseVS = `#version 300 es
precision highp float;
in vec2 aPosition;
out vec2 vUv;
out vec2 vL, vR, vT, vB;
uniform vec2 texelSize;
void main(){
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

function compileShader(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); gl.deleteShader(s); return null; }
  return s;
}

function createProgram(vs, fsSource) {
  const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); }
  const uniforms = {};
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const u = gl.getActiveUniform(prog, i);
    uniforms[u.name] = gl.getUniformLocation(prog, u.name);
  }
  return { program: prog, uniforms };
}

const vs = compileShader(gl.VERTEX_SHADER, baseVS);

// Fragment shaders
const splatFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTarget;
uniform float aspectRatio;
uniform vec3 color;
uniform vec2 point;
uniform float radius;
out vec4 fragColor;
void main(){
  vec2 p = vUv - point;
  p.x *= aspectRatio;
  vec3 splat = exp(-dot(p,p)/radius) * color;
  vec3 base = texture(uTarget, vUv).xyz;
  fragColor = vec4(base + splat, 1.0);
}`;

const advectionFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform float dt;
uniform float dissipation;
out vec4 fragColor;
void main(){
  vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
  vec4 result = dissipation * texture(uSource, coord);
  fragColor = result;
}`;

const divergenceFS = `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity;
out vec4 fragColor;
void main(){
  float L = texture(uVelocity, vL).x;
  float R = texture(uVelocity, vR).x;
  float T = texture(uVelocity, vT).y;
  float B = texture(uVelocity, vB).y;
  float div = 0.5 * (R - L + T - B);
  fragColor = vec4(div, 0.0, 0.0, 1.0);
}`;

const pressureFS = `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
out vec4 fragColor;
void main(){
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  float div = texture(uDivergence, vUv).x;
  float p = (L + R + B + T - div) * 0.25;
  fragColor = vec4(p, 0.0, 0.0, 1.0);
}`;

const gradientSubFS = `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
out vec4 fragColor;
void main(){
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  vec2 vel = texture(uVelocity, vUv).xy;
  vel -= vec2(R - L, T - B) * 0.5;
  fragColor = vec4(vel, 0.0, 1.0);
}`;

const curlFS = `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity;
out vec4 fragColor;
void main(){
  float L = texture(uVelocity, vL).y;
  float R = texture(uVelocity, vR).y;
  float T = texture(uVelocity, vT).x;
  float B = texture(uVelocity, vB).x;
  float vort = R - L - T + B;
  fragColor = vec4(0.5 * vort, 0.0, 0.0, 1.0);
}`;

const vorticityFS = `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float curl;
uniform float dt;
out vec4 fragColor;
void main(){
  float L = texture(uCurl, vL).x;
  float R = texture(uCurl, vR).x;
  float T = texture(uCurl, vT).x;
  float B = texture(uCurl, vB).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 1e-5;
  force *= curl * C;
  force.y *= -1.0;
  vec2 vel = texture(uVelocity, vUv).xy + force * dt;
  fragColor = vec4(vel, 0.0, 1.0);
}`;

const clearFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTexture;
uniform float value;
out vec4 fragColor;
void main(){ fragColor = value * texture(uTexture, vUv); }`;

const displayFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTexture;
out vec4 fragColor;
void main(){
  vec3 c = texture(uTexture, vUv).rgb;
  // Slight bloom / tone mapping
  c = pow(c, vec3(0.85));
  fragColor = vec4(c, 1.0);
}`;

const viscosityFS = `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity;
uniform float alpha;
uniform float rBeta;
out vec4 fragColor;
void main(){
  vec4 L = texture(uVelocity, vL);
  vec4 R = texture(uVelocity, vR);
  vec4 T = texture(uVelocity, vT);
  vec4 B = texture(uVelocity, vB);
  vec4 C = texture(uVelocity, vUv);
  fragColor = (L + R + T + B + alpha * C) * rBeta;
}`;

// Compile programs
const splatProg = createProgram(vs, splatFS);
const advectionProg = createProgram(vs, advectionFS);
const divergenceProg = createProgram(vs, divergenceFS);
const pressureProg = createProgram(vs, pressureFS);
const gradientSubProg = createProgram(vs, gradientSubFS);
const curlProg = createProgram(vs, curlFS);
const vorticityProg = createProgram(vs, vorticityFS);
const clearProg = createProgram(vs, clearFS);
const displayProg = createProgram(vs, displayFS);
const viscosityProg = createProgram(vs, viscosityFS);

// Fullscreen quad
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function blit(target) {
  if (target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, target.width, target.height);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  }
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function createFBO(w, h, internalFormat, format, type, filter) {
  gl.activeTexture(gl.TEXTURE0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { texture: tex, fbo, width: w, height: h, attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, tex); return id; } };
}

function createDoubleFBO(w, h, internalFormat, format, type, filter) {
  let fbo1 = createFBO(w, h, internalFormat, format, type, filter);
  let fbo2 = createFBO(w, h, internalFormat, format, type, filter);
  return {
    width: w, height: h,
    get read() { return fbo1; },
    set read(v) { fbo1 = v; },
    get write() { return fbo2; },
    set write(v) { fbo2 = v; },
    swap() { let t = fbo1; fbo1 = fbo2; fbo2 = t; }
  };
}

// Determine best texture formats
const halfFloat = gl.HALF_FLOAT;
const filtering = ext2 ? gl.LINEAR : gl.NEAREST;

let simWidth, simHeight, dyeWidth, dyeHeight;
let velocity, dye, pressure, divergenceTex, curl;

function getResolution(res) {
  let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
  let min = Math.round(res);
  let max = Math.round(res * aspectRatio);
  if (gl.drawingBufferWidth > gl.drawingBufferHeight) return { width: max, height: min };
  return { width: min, height: max };
}

function initFBOs() {
  let simRes = getResolution(config.SIM_RES);
  let dyeRes = getResolution(Math.min(config.DYE_RES, gl.drawingBufferWidth, gl.drawingBufferHeight));
  simWidth = simRes.width; simHeight = simRes.height;
  dyeWidth = dyeRes.width; dyeHeight = dyeRes.height;

  velocity = createDoubleFBO(simWidth, simHeight, gl.RG16F, gl.RG, halfFloat, filtering);
  dye = createDoubleFBO(dyeWidth, dyeHeight, gl.RGBA16F, gl.RGBA, halfFloat, filtering);
  pressure = createDoubleFBO(simWidth, simHeight, gl.R16F, gl.RED, halfFloat, filtering);
  divergenceTex = createFBO(simWidth, simHeight, gl.R16F, gl.RED, halfFloat, gl.NEAREST);
  curl = createFBO(simWidth, simHeight, gl.R16F, gl.RED, halfFloat, gl.NEAREST);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    initFBOs();
  }
}
resize();
window.addEventListener('resize', resize);

// --- Color generation ---
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return { r: r + m, g: g + m, b: b + m };
}

let globalHue = 0;
function generateColor(id) {
  const t = performance.now() * 0.001;
  const mode = config.colorMode;
  let h, s, l;
  if (mode === 0) { // Neon
    h = (globalHue + id * 137.5) % 360;
    s = 100; l = 55;
  } else if (mode === 1) { // Fire
    h = (id * 47 + t * 30) % 60;
    s = 100; l = 50 + Math.sin(t + id) * 10;
  } else if (mode === 2) { // Ocean
    h = 180 + ((id * 37 + t * 20) % 80);
    s = 90; l = 45 + Math.sin(t * 0.7 + id * 2) * 15;
  } else { // Rainbow
    h = (t * 40 + id * 90) % 360;
    s = 95; l = 50;
  }
  const c = hslToRgb(h, s, l);
  return { r: c.r * 1.2, g: c.g * 1.2, b: c.b * 1.2 };
}

// --- Pointer tracking ---
class Pointer {
  constructor(id) {
    this.id = id;
    this.texcoordX = 0; this.texcoordY = 0;
    this.prevTexcoordX = 0; this.prevTexcoordY = 0;
    this.deltaX = 0; this.deltaY = 0;
    this.down = false;
    this.moved = false;
    this.color = { r: 0, g: 0, b: 0 };
  }
}

let pointers = [new Pointer(-1)];

function getPointer(id) {
  for (let p of pointers) if (p.id === id) return p;
  let p = new Pointer(id);
  pointers.push(p);
  return p;
}

function updatePointerPos(p, x, y) {
  p.prevTexcoordX = p.texcoordX;
  p.prevTexcoordY = p.texcoordY;
  p.texcoordX = x / canvas.clientWidth;
  p.texcoordY = 1.0 - y / canvas.clientHeight;
  p.deltaX = (p.texcoordX - p.prevTexcoordX) * 5.0;
  p.deltaY = (p.texcoordY - p.prevTexcoordY) * 5.0;
  p.moved = Math.abs(p.deltaX) > 0 || Math.abs(p.deltaY) > 0;
}

canvas.addEventListener('mousedown', e => {
  let p = pointers[0];
  p.id = -1; p.down = true;
  p.color = generateColor(0);
  updatePointerPos(p, e.offsetX, e.offsetY);
});
canvas.addEventListener('mousemove', e => {
  let p = pointers[0];
  if (!p.down) return;
  p.color = generateColor(0);
  updatePointerPos(p, e.offsetX, e.offsetY);
});
window.addEventListener('mouseup', () => { pointers[0].down = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (let t of e.changedTouches) {
    let p = getPointer(t.identifier);
    p.down = true;
    p.color = generateColor(t.identifier);
    const rect = canvas.getBoundingClientRect();
    updatePointerPos(p, t.clientX - rect.left, t.clientY - rect.top);
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let t of e.changedTouches) {
    let p = getPointer(t.identifier);
    p.color = generateColor(t.identifier);
    const rect = canvas.getBoundingClientRect();
    updatePointerPos(p, t.clientX - rect.left, t.clientY - rect.top);
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  for (let t of e.changedTouches) {
    let p = getPointer(t.identifier);
    p.down = false;
  }
});

// --- Simulation step ---
function splat(x, y, dx, dy, color) {
  const prog = splatProg;
  gl.useProgram(prog.program);
  gl.uniform1i(prog.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(prog.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(prog.uniforms.point, x, y);
  gl.uniform1f(prog.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
  gl.uniform3f(prog.uniforms.color, dx * config.SPLAT_FORCE, dy * config.SPLAT_FORCE, 0.0);
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(prog.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(prog.uniforms.color, color.r * 0.3, color.g * 0.3, color.b * 0.3);
  blit(dye.write);
  dye.swap();
}

function correctRadius(r) {
  let aspectRatio = canvas.width / canvas.height;
  if (aspectRatio > 1) r *= aspectRatio;
  return r;
}

function step(dt) {
  gl.disable(gl.BLEND);

  // Viscosity diffusion (Jacobi iterations)
  if (viscosity > 0.001) {
    const alpha = 1.0 / (viscosity * dt);
    const rBeta = 1.0 / (4.0 + alpha);
    const prog = viscosityProg;
    gl.useProgram(prog.program);
    gl.uniform1f(prog.uniforms.alpha, alpha);
    gl.uniform1f(prog.uniforms.rBeta, rBeta);
    gl.uniform2f(prog.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
    for (let i = 0; i < 20; i++) {
      gl.uniform1i(prog.uniforms.uVelocity, velocity.read.attach(0));
      blit(velocity.write);
      velocity.swap();
    }
  }

  // Curl
  gl.useProgram(curlProg.program);
  gl.uniform2f(curlProg.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
  gl.uniform1i(curlProg.uniforms.uVelocity, velocity.read.attach(0));
  blit(curl);

  // Vorticity confinement
  gl.useProgram(vorticityProg.program);
  gl.uniform2f(vorticityProg.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
  gl.uniform1i(vorticityProg.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(vorticityProg.uniforms.uCurl, curl.attach(1));
  gl.uniform1f(vorticityProg.uniforms.curl, config.CURL);
  gl.uniform1f(vorticityProg.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  // Divergence
  gl.useProgram(divergenceProg.program);
  gl.uniform2f(divergenceProg.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
  gl.uniform1i(divergenceProg.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergenceTex);

  // Clear pressure
  gl.useProgram(clearProg.program);
  gl.uniform1i(clearProg.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProg.uniforms.value, 0.8);
  blit(pressure.write);
  pressure.swap();

  // Pressure solve (Jacobi)
  gl.useProgram(pressureProg.program);
  gl.uniform2f(pressureProg.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
  gl.uniform1i(pressureProg.uniforms.uDivergence, divergenceTex.attach(1));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(pressureProg.uniforms.uPressure, pressure.read.attach(0));
    blit(pressure.write);
    pressure.swap();
  }

  // Gradient subtract
  gl.useProgram(gradientSubProg.program);
  gl.uniform2f(gradientSubProg.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
  gl.uniform1i(gradientSubProg.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(gradientSubProg.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  // Advect velocity
  gl.useProgram(advectionProg.program);
  gl.uniform2f(advectionProg.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
  gl.uniform1i(advectionProg.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProg.uniforms.uSource, velocity.read.attach(0));
  gl.uniform1f(advectionProg.uniforms.dt, dt);
  gl.uniform1f(advectionProg.uniforms.dissipation, 1.0);
  blit(velocity.write);
  velocity.swap();

  // Advect dye
  gl.uniform2f(advectionProg.uniforms.texelSize, 1.0 / dyeWidth, 1.0 / dyeHeight);
  gl.uniform1i(advectionProg.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProg.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(advectionProg.uniforms.dissipation, 0.985);
  blit(dye.write);
  dye.swap();
}

function render() {
  gl.useProgram(displayProg.program);
  gl.uniform1i(displayProg.uniforms.uTexture, dye.read.attach(0));
  blit(null);
}

// --- Main loop ---
let lastTime = 0;
function frame(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.016666);
  lastTime = t;

  globalHue = (globalHue + dt * 20) % 360;

  // Apply splats
  for (let p of pointers) {
    if (p.down && p.moved) {
      p.color = generateColor(Math.abs(p.id));
      splat(p.texcoordX, p.texcoordY, p.deltaX, p.deltaY, p.color);
      p.moved = false;
    }
  }

  step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- UI ---
const btnMode = document.getElementById('btn-mode');
const btnClear = document.getElementById('btn-clear');
const viscSlider = document.getElementById('viscosity');

btnMode.addEventListener('click', () => {
  config.colorMode = (config.colorMode + 1) % config.colorModes.length;
  btnMode.textContent = config.colorModes[config.colorMode];
});

btnClear.addEventListener('click', () => {
  // Clear dye
  gl.useProgram(clearProg.program);
  gl.uniform1i(clearProg.uniforms.uTexture, dye.read.attach(0));
  gl.uniform1f(clearProg.uniforms.value, 0.0);
  blit(dye.write); dye.swap();

  // Clear velocity
  gl.uniform1i(clearProg.uniforms.uTexture, velocity.read.attach(0));
  gl.uniform1f(clearProg.uniforms.value, 0.0);
  blit(velocity.write); velocity.swap();

  // Clear pressure
  gl.uniform1i(clearProg.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProg.uniforms.value, 0.0);
  blit(pressure.write); pressure.swap();
});

viscSlider.addEventListener('input', () => {
  viscosity = viscSlider.value / 100;
});

// Prevent controls from triggering canvas events
document.getElementById('controls').addEventListener('touchstart', e => e.stopPropagation());
document.getElementById('controls').addEventListener('touchmove', e => e.stopPropagation());

// Auto splat on first load for visual effect
setTimeout(() => {
  const colors = [
    { r: 0.0, g: 1.0, b: 1.0 },
    { r: 1.0, g: 0.2, b: 0.8 },
    { r: 0.2, g: 1.0, b: 0.4 },
  ];
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2;
    const x = 0.5 + Math.cos(angle) * 0.15;
    const y = 0.5 + Math.sin(angle) * 0.15;
    const dx = Math.cos(angle) * 0.003;
    const dy = Math.sin(angle) * 0.003;
    splat(x, y, dx, dy, colors[i]);
  }
}, 100);
</script>
</body>
