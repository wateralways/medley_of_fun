<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>画线物理弹球</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0e27;
  font-family: 'Segoe UI', 'PingFang SC', sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 8px;
  background: linear-gradient(180deg, rgba(10,14,39,0.95) 0%, rgba(10,14,39,0.6) 80%, transparent 100%);
  z-index: 10;
  pointer-events: none;
}

.hud-item {
  text-align: center;
  color: #8892b0;
  font-size: 11px;
  letter-spacing: 0.5px;
}

.hud-value {
  font-size: 22px;
  font-weight: 700;
  color: #ccd6f6;
  text-shadow: 0 0 12px rgba(100,200,255,0.4);
  line-height: 1.2;
}

.hud-value.score { color: #ffd700; text-shadow: 0 0 14px rgba(255,215,0,0.5); }
.hud-value.level { color: #64ffda; text-shadow: 0 0 14px rgba(100,255,218,0.5); }
.hud-value.combo { color: #ff6bff; text-shadow: 0 0 14px rgba(255,107,255,0.5); }

#buttons {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
  flex-wrap: wrap;
  justify-content: center;
}

#buttons button {
  min-width: 100px;
  height: 44px;
  border: 1.5px solid rgba(100,255,218,0.35);
  border-radius: 22px;
  background: rgba(10,14,39,0.85);
  color: #64ffda;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

#buttons button:active {
  background: rgba(100,255,218,0.15);
  transform: scale(0.96);
}

#buttons button.danger {
  border-color: rgba(255,100,100,0.35);
  color: #ff6b6b;
}

#buttons button.danger:active {
  background: rgba(255,100,100,0.15);
}

#lineWidthControl {
  position: fixed;
  bottom: 75px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 10;
  color: #8892b0;
  font-size: 12px;
}

#lineWidthControl input[type="range"] {
  width: 120px;
  accent-color: #64ffda;
}

#lineWidthControl span {
  color: #ccd6f6;
  min-width: 20px;
  text-align: center;
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,14,39,0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}

#overlay.show {
  opacity: 1;
  pointer-events: auto;
}

#overlay h2 {
  font-size: 32px;
  color: #ffd700;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
  margin-bottom: 8px;
}

#overlay p {
  color: #8892b0;
  font-size: 16px;
  margin-bottom: 28px;
}

#overlay button {
  min-width: 180px;
  height: 52px;
  border: 2px solid rgba(100,255,218,0.5);
  border-radius: 26px;
  background: rgba(100,255,218,0.1);
  color: #64ffda;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

#overlay button:active {
  background: rgba(100,255,218,0.25);
  transform: scale(0.96);
}

#msg {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  color: #64ffda;
  font-size: 20px;
  font-weight: 700;
  text-shadow: 0 0 16px rgba(100,255,218,0.6);
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 15;
  pointer-events: none;
  white-space: nowrap;
}

#comboDisplay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);
  color: #ff6bff;
  font-size: 48px;
  font-weight: 900;
  text-shadow: 0 0 30px rgba(255,107,255,0.8), 0 0 60px rgba(255,107,255,0.4);
  opacity: 0;
  z-index: 15;
  pointer-events: none;
  transition: none;
}
</style>
</head>
<body>

<div id="hud">
  <div class="hud-item"><div class="hud-value score" id="scoreVal">0</div>得分</div>
  <div class="hud-item"><div class="hud-value level" id="levelVal">1</div>关卡</div>
  <div class="hud-item"><div class="hud-value" id="lineVal">0</div>线条</div>
  <div class="hud-item"><div class="hud-value" id="starVal">0</div>剩余星</div>
  <div class="hud-item"><div class="hud-value combo" id="comboVal">x1</div>连击</div>
</div>

<canvas id="c"></canvas>

<div id="lineWidthControl">
  线条粗细: <input type="range" id="lineWidthSlider" min="2" max="14" value="5" step="1">
  <span id="lineWidthLabel">5</span>
</div>

<div id="buttons">
  <button class="danger" id="btnClear">清除线条</button>
  <button id="btnReset">重置关卡</button>
  <button id="btnDrop">投球</button>
</div>

<div id="overlay">
  <h2 id="olTitle">画线物理弹球</h2>
  <p id="olDesc">在屏幕上画线引导小球收集星星</p>
  <button id="olBtn">开始游戏</button>
</div>

<div id="msg"></div>
<div id="comboDisplay"></div>

<script>
// ========== Setup ==========
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ========== Web Audio API Sound System ==========
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  try {
    ensureAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    switch(type) {
      case 'hitLine':
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
        break;
      case 'hitWall':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
        break;
      case 'collectStar':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.06);
        osc.frequency.setValueAtTime(784, now + 0.12);
        osc.frequency.setValueAtTime(1047, now + 0.18);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
        break;
      case 'hitBumper':
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
        break;
      case 'combo':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1108, now + 0.05);
        osc.frequency.setValueAtTime(1318, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
        break;
      case 'levelComplete':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.12);
        osc.frequency.setValueAtTime(784, now + 0.24);
        osc.frequency.setValueAtTime(1047, now + 0.36);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.start(now);
        osc.stop(now + 0.8);
        break;
    }
  } catch(e) {}
}

// ========== State ==========
let score = 0;
let currentLevel = 0;
let lines = [];
let drawingLine = null;
let balls = [];
let stars = [];
let bumpers = [];
let movingObstacles = [];
let particles = [];
let collectFx = [];
let bgStars = [];
let comboTexts = [];
let sparkParticles = [];
let gameRunning = false;
let lastTime = 0;

// Screen shake
let shakeX = 0, shakeY = 0, shakeMag = 0, shakeDecay = 0.9;

// Combo system
let comboCount = 0;
let comboTimer = 0;
const COMBO_WINDOW = 2.0; // seconds to maintain combo

// Line width
let userLineWidth = 5;
const lwSlider = document.getElementById('lineWidthSlider');
const lwLabel = document.getElementById('lineWidthLabel');
lwSlider.addEventListener('input', () => {
  userLineWidth = parseInt(lwSlider.value);
  lwLabel.textContent = userLineWidth;
});

// Physics
const GRAVITY = 980;
const RESTITUTION = 0.65;
const FRICTION = 0.992;
const AIR_DRAG = 0.9995;
const BALL_RADIUS = 10;
const LINE_WIDTH_COLLISION = 6;
const MAX_LINES = 15;
const MAX_BALLS = 5;
const BUMPER_RESTITUTION = 1.5;

// ========== Levels ==========
function makeLevels() {
  const levels = [];
  const cx = W / 2, margin = 50;
  const top = 120, bottom = H - 140;
  const usableH = bottom - top;

  // Level 1: simple scatter
  levels.push({
    stars: [
      { x: cx - 60, y: top + usableH * 0.35 },
      { x: cx + 60, y: top + usableH * 0.35 },
      { x: cx, y: top + usableH * 0.55 },
      { x: cx - 40, y: top + usableH * 0.7 },
      { x: cx + 40, y: top + usableH * 0.7 },
    ],
    bumpers: [],
    movingObstacles: [],
    ballDrop: { x: cx, y: top - 20 },
    hint: '画线挡住小球，引导它碰到星星'
  });

  // Level 2: zigzag with bumpers
  levels.push({
    stars: [
      { x: margin + 40, y: top + usableH * 0.25 },
      { x: W - margin - 40, y: top + usableH * 0.4 },
      { x: margin + 40, y: top + usableH * 0.55 },
      { x: W - margin - 40, y: top + usableH * 0.7 },
      { x: cx, y: top + usableH * 0.85 },
    ],
    bumpers: [
      { x: cx, y: top + usableH * 0.32, r: 20 },
      { x: cx, y: top + usableH * 0.62, r: 20 },
    ],
    movingObstacles: [],
    ballDrop: { x: cx, y: top - 20 },
    hint: '弹性圆柱会弹开球并加分！'
  });

  // Level 3: V shape with bumpers
  levels.push({
    stars: [
      { x: cx - 80, y: top + usableH * 0.3 },
      { x: cx + 80, y: top + usableH * 0.3 },
      { x: cx - 50, y: top + usableH * 0.5 },
      { x: cx + 50, y: top + usableH * 0.5 },
      { x: cx, y: top + usableH * 0.45 },
      { x: cx, y: top + usableH * 0.7 },
    ],
    bumpers: [
      { x: cx - 30, y: top + usableH * 0.38, r: 18 },
      { x: cx + 30, y: top + usableH * 0.38, r: 18 },
      { x: cx, y: top + usableH * 0.6, r: 22 },
    ],
    movingObstacles: [],
    ballDrop: { x: cx, y: top - 20 },
    hint: '连续快速收集星星获得连击加分！'
  });

  // Level 4: spread with more bumpers
  levels.push({
    stars: [
      { x: margin + 30, y: top + usableH * 0.2 },
      { x: W - margin - 30, y: top + usableH * 0.2 },
      { x: cx, y: top + usableH * 0.35 },
      { x: margin + 60, y: top + usableH * 0.5 },
      { x: W - margin - 60, y: top + usableH * 0.5 },
      { x: cx - 90, y: top + usableH * 0.7 },
      { x: cx + 90, y: top + usableH * 0.7 },
      { x: cx, y: top + usableH * 0.85 },
    ],
    bumpers: [
      { x: cx - 50, y: top + usableH * 0.28, r: 20 },
      { x: cx + 50, y: top + usableH * 0.28, r: 20 },
      { x: cx, y: top + usableH * 0.55, r: 25 },
    ],
    movingObstacles: [],
    ballDrop: { x: cx, y: top - 20 },
    hint: '需要多条线和多个球'
  });

  // Level 5: dense cluster
  levels.push({
    stars: [
      { x: cx - 60, y: top + usableH * 0.3 },
      { x: cx, y: top + usableH * 0.25 },
      { x: cx + 60, y: top + usableH * 0.3 },
      { x: cx - 40, y: top + usableH * 0.45 },
      { x: cx + 40, y: top + usableH * 0.45 },
      { x: cx - 80, y: top + usableH * 0.6 },
      { x: cx + 80, y: top + usableH * 0.6 },
      { x: cx, y: top + usableH * 0.6 },
      { x: cx - 20, y: top + usableH * 0.78 },
      { x: cx + 20, y: top + usableH * 0.78 },
    ],
    bumpers: [
      { x: cx - 80, y: top + usableH * 0.38, r: 18 },
      { x: cx + 80, y: top + usableH * 0.38, r: 18 },
      { x: cx, y: top + usableH * 0.5, r: 22 },
      { x: cx - 50, y: top + usableH * 0.68, r: 16 },
      { x: cx + 50, y: top + usableH * 0.68, r: 16 },
    ],
    movingObstacles: [],
    ballDrop: { x: cx, y: top - 20 },
    hint: '弹力圆柱构成密集迷阵！'
  });

  // Level 6: first moving obstacles!
  levels.push({
    stars: [
      { x: cx - 70, y: top + usableH * 0.2 },
      { x: cx + 70, y: top + usableH * 0.2 },
      { x: cx, y: top + usableH * 0.4 },
      { x: cx - 50, y: top + usableH * 0.6 },
      { x: cx + 50, y: top + usableH * 0.6 },
      { x: cx, y: top + usableH * 0.8 },
    ],
    bumpers: [
      { x: cx, y: top + usableH * 0.3, r: 22 },
    ],
    movingObstacles: [
      { x: cx, y: top + usableH * 0.5, w: 100, h: 10, moveType: 'horizontal', range: 80, speed: 1.2 },
    ],
    ballDrop: { x: cx, y: top - 20 },
    hint: '小心！移动障碍物出现了！'
  });

  // Level 7: more moving obstacles
  levels.push({
    stars: [
      { x: margin + 50, y: top + usableH * 0.18 },
      { x: W - margin - 50, y: top + usableH * 0.18 },
      { x: cx, y: top + usableH * 0.3 },
      { x: margin + 40, y: top + usableH * 0.5 },
      { x: W - margin - 40, y: top + usableH * 0.5 },
      { x: cx - 60, y: top + usableH * 0.7 },
      { x: cx + 60, y: top + usableH * 0.7 },
      { x: cx, y: top + usableH * 0.88 },
    ],
    bumpers: [
      { x: cx - 60, y: top + usableH * 0.4, r: 18 },
      { x: cx + 60, y: top + usableH * 0.4, r: 18 },
    ],
    movingObstacles: [
      { x: cx, y: top + usableH * 0.25, w: 80, h: 10, moveType: 'horizontal', range: 100, speed: 1.5 },
      { x: cx, y: top + usableH * 0.6, w: 80, h: 10, moveType: 'horizontal', range: 90, speed: 1.0 },
    ],
    ballDrop: { x: cx, y: top - 20 },
    hint: '两道移动障碍——找准时机投球！'
  });

  // Level 8: ultimate challenge
  levels.push({
    stars: [
      { x: cx - 90, y: top + usableH * 0.15 },
      { x: cx + 90, y: top + usableH * 0.15 },
      { x: cx, y: top + usableH * 0.22 },
      { x: cx - 60, y: top + usableH * 0.38 },
      { x: cx + 60, y: top + usableH * 0.38 },
      { x: cx, y: top + usableH * 0.5 },
      { x: margin + 40, y: top + usableH * 0.65 },
      { x: W - margin - 40, y: top + usableH * 0.65 },
      { x: cx - 30, y: top + usableH * 0.8 },
      { x: cx + 30, y: top + usableH * 0.8 },
      { x: cx, y: top + usableH * 0.92 },
    ],
    bumpers: [
      { x: cx - 40, y: top + usableH * 0.28, r: 20 },
      { x: cx + 40, y: top + usableH * 0.28, r: 20 },
      { x: cx, y: top + usableH * 0.45, r: 25 },
      { x: cx - 70, y: top + usableH * 0.58, r: 18 },
      { x: cx + 70, y: top + usableH * 0.58, r: 18 },
    ],
    movingObstacles: [
      { x: cx - 50, y: top + usableH * 0.35, w: 70, h: 10, moveType: 'horizontal', range: 70, speed: 1.8 },
      { x: cx + 50, y: top + usableH * 0.55, w: 70, h: 10, moveType: 'horizontal', range: 60, speed: 1.3 },
      { x: cx, y: top + usableH * 0.73, w: 90, h: 10, moveType: 'horizontal', range: 100, speed: 2.0 },
    ],
    ballDrop: { x: cx, y: top - 20 },
    hint: '终极挑战！11颗星+3道移动障碍！'
  });

  return levels;
}

let levels = makeLevels();
window.addEventListener('resize', () => { levels = makeLevels(); });

// ========== Background stars ==========
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 120; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.5 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 1.5 + 0.5
    });
  }
}
initBgStars();

// ========== Drawing (line input) ==========
let isDrawing = false;

function getPointerPos(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

function isOnUI(pos) {
  return pos.y < 65 || pos.y > H - 90;
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);

function onDown(e) {
  if (!gameRunning) return;
  const pos = getPointerPos(e);
  if (isOnUI(pos)) return;
  if (lines.length >= MAX_LINES) return;
  isDrawing = true;
  drawingLine = [{ x: pos.x, y: pos.y }];
  canvas.setPointerCapture(e.pointerId);
}

function onMove(e) {
  if (!isDrawing || !drawingLine) return;
  const pos = getPointerPos(e);
  const last = drawingLine[drawingLine.length - 1];
  const dx = pos.x - last.x, dy = pos.y - last.y;
  if (dx * dx + dy * dy > 36) { // min 6px for smoother curves
    drawingLine.push({ x: pos.x, y: pos.y });
  }
}

function onUp(e) {
  if (!isDrawing) return;
  isDrawing = false;
  if (drawingLine && drawingLine.length >= 2) {
    const simplified = simplifyLine(drawingLine, 3);
    lines.push({ pts: simplified, width: userLineWidth });
    updateHUD();
    playSound('hitLine');
  }
  drawingLine = null;
}

// Douglas-Peucker simplification
function simplifyLine(pts, tol) {
  if (pts.length <= 2) return pts;
  let maxDist = 0, idx = 0;
  const s = pts[0], e = pts[pts.length - 1];
  for (let i = 1; i < pts.length - 1; i++) {
    const d = pointToSegDist(pts[i], s, e);
    if (d > maxDist) { maxDist = d; idx = i; }
  }
  if (maxDist > tol) {
    const l = simplifyLine(pts.slice(0, idx + 1), tol);
    const r = simplifyLine(pts.slice(idx), tol);
    return l.slice(0, -1).concat(r);
  }
  return [s, e];
}

// ========== Physics Helpers ==========
function pointToSegDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

function closestPointOnSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return { x: a.x, y: a.y, t: 0 };
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return { x: a.x + t * dx, y: a.y + t * dy, t };
}

// ========== Screen Shake ==========
function triggerShake(magnitude) {
  shakeMag = Math.max(shakeMag, magnitude);
}

// ========== Spark Particles (wall collision) ==========
function spawnSparks(x, y, nx, ny, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.atan2(ny, nx) + (Math.random() - 0.5) * Math.PI * 0.8;
    const speed = 100 + Math.random() * 250;
    sparkParticles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.3 + Math.random() * 0.4,
      maxLife: 0.3 + Math.random() * 0.4,
      r: 1 + Math.random() * 2,
      hue: 30 + Math.random() * 30 // orange-yellow sparks
    });
  }
}

// ========== Ball-Line Collision ==========
function resolveCollisions(ball, dt) {
  // Wall collisions
  const wallSegs = [
    { a: { x: 0, y: 0 }, b: { x: 0, y: H }, type: 'wall' },
    { a: { x: W, y: 0 }, b: { x: W, y: H }, type: 'wall' },
    { a: { x: 0, y: H + 50 }, b: { x: W, y: H + 50 }, type: 'wall' },
  ];

  for (const seg of wallSegs) {
    const cp = closestPointOnSeg(ball, seg.a, seg.b);
    const dx = ball.x - cp.x, dy = ball.y - cp.y;
    const dist = Math.hypot(dx, dy);
    if (dist < BALL_RADIUS + 2 && dist > 0.01) {
      const nx = dx / dist, ny = dy / dist;
      const overlap = BALL_RADIUS + 2 - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const vDotN = ball.vx * nx + ball.vy * ny;
      if (vDotN < 0) {
        ball.vx -= (1 + RESTITUTION) * vDotN * nx;
        ball.vy -= (1 + RESTITUTION) * vDotN * ny;
        const impactSpeed = Math.abs(vDotN);
        if (impactSpeed > 50) {
          playSound('hitWall');
          triggerShake(Math.min(impactSpeed * 0.01, 4));
          spawnSparks(cp.x, cp.y, nx, ny, Math.floor(impactSpeed * 0.04));
        }
      }
    }
  }

  // Player lines
  const allLineSegs = [];
  for (const line of lines) {
    const pts = line.pts;
    const lw = line.width || 5;
    for (let i = 0; i < pts.length - 1; i++) {
      allLineSegs.push({ a: pts[i], b: pts[i + 1], type: 'line', colW: lw });
    }
  }
  if (drawingLine && drawingLine.length >= 2) {
    for (let i = 0; i < drawingLine.length - 1; i++) {
      allLineSegs.push({ a: drawingLine[i], b: drawingLine[i + 1], type: 'line', colW: userLineWidth });
    }
  }

  // Moving obstacles as line segments
  for (const obs of movingObstacles) {
    const hw = obs.w / 2;
    const hh = obs.h / 2;
    const ox = obs.currentX;
    const oy = obs.y;
    // Top edge
    allLineSegs.push({ a: { x: ox - hw, y: oy - hh }, b: { x: ox + hw, y: oy - hh }, type: 'obstacle', colW: 4 });
    // Bottom edge
    allLineSegs.push({ a: { x: ox - hw, y: oy + hh }, b: { x: ox + hw, y: oy + hh }, type: 'obstacle', colW: 4 });
    // Left edge
    allLineSegs.push({ a: { x: ox - hw, y: oy - hh }, b: { x: ox - hw, y: oy + hh }, type: 'obstacle', colW: 4 });
    // Right edge
    allLineSegs.push({ a: { x: ox + hw, y: oy - hh }, b: { x: ox + hw, y: oy + hh }, type: 'obstacle', colW: 4 });
  }

  for (const seg of allLineSegs) {
    const colW = seg.colW || LINE_WIDTH_COLLISION;
    const cp = closestPointOnSeg(ball, seg.a, seg.b);
    const dx = ball.x - cp.x, dy = ball.y - cp.y;
    const dist = Math.hypot(dx, dy);
    if (dist < BALL_RADIUS + colW && dist > 0.01) {
      const nx = dx / dist, ny = dy / dist;
      const overlap = BALL_RADIUS + colW - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const vDotN = ball.vx * nx + ball.vy * ny;
      if (vDotN < 0) {
        ball.vx -= (1 + RESTITUTION) * vDotN * nx;
        ball.vy -= (1 + RESTITUTION) * vDotN * ny;
        // Tangential friction
        const tx = -ny, ty = nx;
        const vDotT = ball.vx * tx + ball.vy * ty;
        ball.vx -= vDotT * 0.05;
        ball.vy -= vDotT * 0.05;

        const impactSpeed = Math.abs(vDotN);
        if (seg.type === 'line') {
          playSound('hitLine');
        } else if (seg.type === 'obstacle') {
          playSound('hitWall');
          if (impactSpeed > 30) {
            triggerShake(Math.min(impactSpeed * 0.008, 3));
          }
        }

        // Spawn impact particles
        for (let i = 0; i < 4; i++) {
          particles.push({
            x: cp.x, y: cp.y,
            vx: (Math.random() - 0.5) * 100,
            vy: (Math.random() - 0.5) * 100,
            life: 0.4 + Math.random() * 0.3,
            maxLife: 0.4 + Math.random() * 0.3,
            r: 2 + Math.random() * 2,
            color: 'rgba(100,200,255,'
          });
        }
      }
    }
  }

  // Bumper collisions
  for (const bump of bumpers) {
    const dx = ball.x - bump.x;
    const dy = ball.y - bump.y;
    const dist = Math.hypot(dx, dy);
    const minDist = BALL_RADIUS + bump.r;
    if (dist < minDist && dist > 0.01) {
      const nx = dx / dist, ny = dy / dist;
      const overlap = minDist - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      // Strong bounce
      const vDotN = ball.vx * nx + ball.vy * ny;
      if (vDotN < 0) {
        ball.vx -= (1 + BUMPER_RESTITUTION) * vDotN * nx;
        ball.vy -= (1 + BUMPER_RESTITUTION) * vDotN * ny;
        // Minimum bounce speed
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed < 300) {
          ball.vx = nx * 300;
          ball.vy = ny * 300;
        }
      }
      score += 25;
      bump.hitAnim = 1.0; // trigger animation
      playSound('hitBumper');
      triggerShake(3);

      // Bumper particles
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
          x: bump.x + Math.cos(a) * bump.r,
          y: bump.y + Math.sin(a) * bump.r,
          vx: Math.cos(a) * (60 + Math.random() * 80),
          vy: Math.sin(a) * (60 + Math.random() * 80),
          life: 0.3 + Math.random() * 0.3,
          maxLife: 0.3 + Math.random() * 0.3,
          r: 2 + Math.random() * 2,
          color: 'rgba(255,100,255,'
        });
      }
      updateHUD();
    }
  }
}

// ========== Star collection ==========
function checkStarCollection(ball) {
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    if (s.collected) continue;
    const dx = ball.x - s.x, dy = ball.y - s.y;
    if (dx * dx + dy * dy < (BALL_RADIUS + s.r) * (BALL_RADIUS + s.r)) {
      s.collected = true;

      // Combo system
      comboTimer = COMBO_WINDOW;
      comboCount++;
      const multiplier = Math.min(comboCount, 10);
      const baseScore = 100;
      const earnedScore = baseScore * multiplier;
      score += earnedScore;

      playSound('collectStar');
      if (multiplier >= 2) {
        playSound('combo');
        showComboText(`x${multiplier} 连击！+${earnedScore}`);
      }

      // Collect effect
      for (let j = 0; j < 16; j++) {
        const a = (j / 16) * Math.PI * 2;
        collectFx.push({
          x: s.x, y: s.y,
          vx: Math.cos(a) * (80 + Math.random() * 60),
          vy: Math.sin(a) * (80 + Math.random() * 60),
          life: 0.6 + Math.random() * 0.3,
          maxLife: 0.6 + Math.random() * 0.3,
          r: 2.5,
          color: 'rgba(255,215,0,'
        });
      }

      triggerShake(2);
      updateHUD();
      checkLevelComplete();
    }
  }
}

// ========== Combo Display ==========
function showComboText(text) {
  comboTexts.push({
    text,
    x: W / 2,
    y: H * 0.4,
    life: 1.2,
    maxLife: 1.2,
    scale: 0,
    targetScale: 1
  });
}

// ========== Level Complete ==========
function checkLevelComplete() {
  if (stars.every(s => s.collected)) {
    playSound('levelComplete');
    setTimeout(() => {
      showMessage('关卡完成！');
      setTimeout(() => {
        currentLevel++;
        if (currentLevel >= levels.length) {
          generateProceduralLevel();
        }
        loadLevel(currentLevel);
      }, 1200);
    }, 300);
  }
}

function generateProceduralLevel() {
  const cx = W / 2, margin = 50;
  const top = 120, bottom = H - 140;
  const usableH = bottom - top;
  const lvNum = levels.length + 1;
  const numStars = 6 + Math.floor(Math.random() * 6);
  const starArr = [];
  for (let i = 0; i < numStars; i++) {
    starArr.push({
      x: margin + 30 + Math.random() * (W - margin * 2 - 60),
      y: top + usableH * 0.2 + Math.random() * usableH * 0.7
    });
  }
  const numBumpers = 2 + Math.floor(Math.random() * 4);
  const bumperArr = [];
  for (let i = 0; i < numBumpers; i++) {
    bumperArr.push({
      x: margin + 40 + Math.random() * (W - margin * 2 - 80),
      y: top + usableH * 0.2 + Math.random() * usableH * 0.6,
      r: 16 + Math.random() * 10
    });
  }
  const numMoving = Math.min(Math.floor(lvNum / 3), 4);
  const movArr = [];
  for (let i = 0; i < numMoving; i++) {
    movArr.push({
      x: cx,
      y: top + usableH * (0.25 + i * 0.2),
      w: 60 + Math.random() * 50,
      h: 10,
      moveType: 'horizontal',
      range: 60 + Math.random() * 60,
      speed: 0.8 + Math.random() * 1.5
    });
  }
  levels.push({
    stars: starArr,
    bumpers: bumperArr,
    movingObstacles: movArr,
    ballDrop: { x: cx, y: top - 20 },
    hint: `关卡 ${lvNum} — 收集 ${numStars} 颗星星`
  });
}

// ========== Game flow ==========
function loadLevel(idx) {
  if (idx >= levels.length) {
    generateProceduralLevel();
  }
  const lv = levels[idx];
  lines = [];
  balls = [];
  particles = [];
  collectFx = [];
  sparkParticles = [];
  comboTexts = [];
  drawingLine = null;
  isDrawing = false;
  comboCount = 0;
  comboTimer = 0;
  shakeMag = 0;

  stars = lv.stars.map(s => ({
    x: s.x, y: s.y, r: 16, collected: false, phase: Math.random() * Math.PI * 2
  }));
  bumpers = (lv.bumpers || []).map(b => ({
    x: b.x, y: b.y, r: b.r, hitAnim: 0
  }));
  movingObstacles = (lv.movingObstacles || []).map(o => ({
    ...o,
    baseX: o.x,
    currentX: o.x,
    time: Math.random() * Math.PI * 2
  }));

  updateHUD();
  showMessage(lv.hint || `关卡 ${idx + 1}`);
}

function dropBall() {
  if (!gameRunning) return;
  ensureAudio();
  if (balls.length >= MAX_BALLS) {
    showMessage('球数已满！清除线条重置');
    return;
  }
  const lv = levels[currentLevel];
  const drop = lv ? lv.ballDrop : { x: W / 2, y: 80 };
  balls.push({
    x: drop.x + (Math.random() - 0.5) * 20,
    y: drop.y,
    vx: (Math.random() - 0.5) * 40,
    vy: 0,
    trail: []
  });
}

function clearLines() {
  lines = [];
  drawingLine = null;
  updateHUD();
}

function resetLevel() {
  loadLevel(currentLevel);
}

// ========== HUD ==========
function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('levelVal').textContent = currentLevel + 1;
  document.getElementById('lineVal').textContent = lines.length;
  document.getElementById('starVal').textContent = stars.filter(s => !s.collected).length;
  const mult = Math.min(comboCount, 10);
  document.getElementById('comboVal').textContent = mult > 1 ? `x${mult}` : 'x1';
}

let msgTimer;
function showMessage(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

// ========== Drawing ==========
function drawBackground(time) {
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#0a0e27');
  grd.addColorStop(0.5, '#101638');
  grd.addColorStop(1, '#0a0e27');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  for (const s of bgStars) {
    s.twinkle += s.speed * 0.02;
    const a = s.a * (0.5 + 0.5 * Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,200,255,${a})`;
    ctx.fill();
  }
}

function drawLines() {
  for (const line of lines) {
    drawSingleLine(line.pts, 'rgba(100,200,255,0.5)', 'rgba(100,200,255,0.15)', line.width || 5);
  }
  if (drawingLine && drawingLine.length >= 2) {
    drawSingleLine(drawingLine, 'rgba(100,255,218,0.7)', 'rgba(100,255,218,0.25)', userLineWidth);
  }
}

function drawSingleLine(pts, strokeColor, glowColor, width) {
  if (pts.length < 2) return;

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 14;

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);

  if (pts.length === 2) {
    ctx.lineTo(pts[1].x, pts[1].y);
  } else {
    // Smooth bezier curve through points
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    // Last segment
    const last = pts[pts.length - 1];
    const prev = pts[pts.length - 2];
    ctx.quadraticCurveTo(prev.x, prev.y, last.x, last.y);
  }

  // Outer glow
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = width + 8;
  ctx.stroke();

  // Core line
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = width;
  ctx.shadowBlur = 0;
  ctx.stroke();

  // Bright center
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = width * 0.35;
  ctx.stroke();

  ctx.restore();
}

function drawStars(time) {
  for (const s of stars) {
    if (s.collected) continue;
    s.phase += 0.03;

    ctx.save();
    ctx.translate(s.x, s.y);

    const glowR = s.r + 8 + Math.sin(s.phase) * 4;
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
    grd.addColorStop(0, 'rgba(255,215,0,0.4)');
    grd.addColorStop(0.5, 'rgba(255,215,0,0.1)');
    grd.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(-glowR, -glowR, glowR * 2, glowR * 2);

    ctx.beginPath();
    const spikes = 5;
    const outerR = s.r;
    const innerR = s.r * 0.45;
    for (let i = 0; i < spikes * 2; i++) {
      const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
      const r = i % 2 === 0 ? outerR : innerR;
      if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
      else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    }
    ctx.closePath();

    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = 'rgba(255,215,0,0.8)';
    ctx.shadowBlur = 12;
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(-3, -3, s.r * 0.25, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawBumpers(time) {
  for (const bump of bumpers) {
    ctx.save();

    // Animate on hit
    let scale = 1;
    if (bump.hitAnim > 0) {
      scale = 1 + bump.hitAnim * 0.4;
    }

    ctx.translate(bump.x, bump.y);
    ctx.scale(scale, scale);

    // Outer glow
    const glowR = bump.r + 10;
    const grd = ctx.createRadialGradient(0, 0, bump.r * 0.3, 0, 0, glowR);
    grd.addColorStop(0, bump.hitAnim > 0.3 ? 'rgba(255,150,255,0.6)' : 'rgba(255,100,200,0.3)');
    grd.addColorStop(0.6, 'rgba(255,100,200,0.1)');
    grd.addColorStop(1, 'rgba(255,100,200,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Main body
    const bg = ctx.createRadialGradient(-bump.r * 0.2, -bump.r * 0.2, 0, 0, 0, bump.r);
    bg.addColorStop(0, '#ff80d0');
    bg.addColorStop(0.6, '#cc40a0');
    bg.addColorStop(1, '#8a2070');
    ctx.fillStyle = bg;
    ctx.shadowColor = 'rgba(255,100,200,0.8)';
    ctx.shadowBlur = bump.hitAnim > 0 ? 20 : 10;
    ctx.beginPath();
    ctx.arc(0, 0, bump.r, 0, Math.PI * 2);
    ctx.fill();

    // Inner ring
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, bump.r * 0.6, 0, Math.PI * 2);
    ctx.stroke();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(-bump.r * 0.25, -bump.r * 0.25, bump.r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawMovingObstacles() {
  for (const obs of movingObstacles) {
    const hw = obs.w / 2;
    const hh = obs.h / 2;
    const ox = obs.currentX;
    const oy = obs.y;

    ctx.save();

    // Glow
    ctx.shadowColor = 'rgba(255,80,80,0.6)';
    ctx.shadowBlur = 12;

    // Body
    const grd = ctx.createLinearGradient(ox - hw, oy - hh, ox + hw, oy + hh);
    grd.addColorStop(0, '#ff4444');
    grd.addColorStop(0.5, '#ff6666');
    grd.addColorStop(1, '#cc2222');
    ctx.fillStyle = grd;

    // Rounded rect
    const r = Math.min(hh, 5);
    ctx.beginPath();
    ctx.moveTo(ox - hw + r, oy - hh);
    ctx.lineTo(ox + hw - r, oy - hh);
    ctx.arcTo(ox + hw, oy - hh, ox + hw, oy - hh + r, r);
    ctx.lineTo(ox + hw, oy + hh - r);
    ctx.arcTo(ox + hw, oy + hh, ox + hw - r, oy + hh, r);
    ctx.lineTo(ox - hw + r, oy + hh);
    ctx.arcTo(ox - hw, oy + hh, ox - hw, oy + hh - r, r);
    ctx.lineTo(ox - hw, oy - hh + r);
    ctx.arcTo(ox - hw, oy - hh, ox - hw + r, oy - hh, r);
    ctx.closePath();
    ctx.fill();

    // Direction indicator arrows
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u25C0\u25B6', ox, oy);

    ctx.restore();
  }
}

function drawBalls(time) {
  for (const ball of balls) {
    ctx.save();
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i];
      const alpha = (i / ball.trail.length) * 0.35;
      const r = BALL_RADIUS * (i / ball.trail.length) * 0.8;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(150,200,255,${alpha})`;
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    const grd = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_RADIUS + 12);
    grd.addColorStop(0, 'rgba(200,230,255,0.3)');
    grd.addColorStop(1, 'rgba(200,230,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS + 12, 0, Math.PI * 2);
    ctx.fill();

    const bg = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, BALL_RADIUS);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.7, '#c8e0ff');
    bg.addColorStop(1, '#8ab4f8');
    ctx.fillStyle = bg;
    ctx.shadowColor = 'rgba(150,200,255,0.8)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
    ctx.fillStyle = p.color + (a * 0.7) + ')';
    ctx.fill();
  }
  for (const p of collectFx) {
    const a = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
    ctx.fillStyle = p.color + (a * 0.9) + ')';
    ctx.fill();
  }
  // Spark particles (fire sparks for wall hits)
  for (const p of sparkParticles) {
    const a = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = `hsl(${p.hue}, 100%, ${50 + a * 40}%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.3 + a * 0.7), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawComboTexts() {
  for (const ct of comboTexts) {
    const a = ct.life / ct.maxLife;
    const progress = 1 - a;
    ct.scale += (ct.targetScale - ct.scale) * 0.15;
    const drawScale = ct.scale * (1 + progress * 0.3);

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(ct.x, ct.y - progress * 60);
    ctx.scale(drawScale, drawScale);
    ctx.font = 'bold 36px "Segoe UI", "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff6bff';
    ctx.shadowColor = 'rgba(255,107,255,0.8)';
    ctx.shadowBlur = 20;
    ctx.fillText(ct.text, 0, 0);
    ctx.restore();
  }
}

// ========== Update ==========
function update(dt) {
  if (dt > 0.05) dt = 0.05;

  // Update combo timer
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      comboCount = 0;
      comboTimer = 0;
      updateHUD();
    }
  }

  // Update screen shake
  if (shakeMag > 0.1) {
    shakeX = (Math.random() - 0.5) * shakeMag * 2;
    shakeY = (Math.random() - 0.5) * shakeMag * 2;
    shakeMag *= shakeDecay;
  } else {
    shakeX = 0;
    shakeY = 0;
    shakeMag = 0;
  }

  // Update moving obstacles
  for (const obs of movingObstacles) {
    obs.time += dt * obs.speed;
    if (obs.moveType === 'horizontal') {
      obs.currentX = obs.baseX + Math.sin(obs.time) * obs.range;
    }
  }

  // Update bumper animations
  for (const bump of bumpers) {
    if (bump.hitAnim > 0) {
      bump.hitAnim -= dt * 3;
      if (bump.hitAnim < 0) bump.hitAnim = 0;
    }
  }

  // Update balls
  for (const ball of balls) {
    ball.vy += GRAVITY * dt;
    ball.vx *= AIR_DRAG;
    ball.vy *= AIR_DRAG;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;

    resolveCollisions(ball, dt);
    checkStarCollection(ball);

    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 20) ball.trail.shift();

    if (Math.random() < 0.4) {
      particles.push({
        x: ball.x + (Math.random() - 0.5) * 6,
        y: ball.y + (Math.random() - 0.5) * 6,
        vx: (Math.random() - 0.5) * 30 - ball.vx * 0.05,
        vy: (Math.random() - 0.5) * 30 - ball.vy * 0.05,
        life: 0.3 + Math.random() * 0.4,
        maxLife: 0.3 + Math.random() * 0.4,
        r: 1.5 + Math.random() * 2,
        color: 'rgba(150,200,255,'
      });
    }
  }

  // Remove off-screen balls
  balls = balls.filter(b => b.y < H + 200);

  // Update particles
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const p of collectFx) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= dt;
  }
  collectFx = collectFx.filter(p => p.life > 0);

  // Update spark particles (affected by gravity)
  for (const p of sparkParticles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt; // sparks fall
    p.life -= dt;
  }
  sparkParticles = sparkParticles.filter(p => p.life > 0);

  // Update combo texts
  for (const ct of comboTexts) {
    ct.life -= dt;
  }
  comboTexts = comboTexts.filter(ct => ct.life > 0);
}

// ========== Main Loop ==========
function frame(time) {
  const dt = lastTime ? (time - lastTime) / 1000 : 0.016;
  lastTime = time;

  if (gameRunning) {
    update(dt);
  }

  ctx.save();
  // Apply screen shake
  ctx.translate(shakeX, shakeY);

  drawBackground(time);
  drawMovingObstacles();
  drawBumpers(time);
  drawStars(time);
  drawLines();
  drawBalls(time);
  drawParticles();
  drawComboTexts();

  ctx.restore();

  requestAnimationFrame(frame);
}

// ========== Buttons ==========
document.getElementById('btnClear').addEventListener('click', clearLines);
document.getElementById('btnReset').addEventListener('click', resetLevel);
document.getElementById('btnDrop').addEventListener('click', dropBall);

// Overlay
const overlay = document.getElementById('overlay');
const olBtn = document.getElementById('olBtn');
const olTitle = document.getElementById('olTitle');
const olDesc = document.getElementById('olDesc');

function showOverlay(title, desc, btnText) {
  olTitle.textContent = title;
  olDesc.textContent = desc;
  olBtn.textContent = btnText;
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
}

olBtn.addEventListener('click', () => {
  hideOverlay();
  ensureAudio();
  gameRunning = true;
  loadLevel(currentLevel);
});

// Init
showOverlay('画线物理弹球', '在屏幕上画线，引导小球收集金色星星', '开始游戏');
requestAnimationFrame(frame);
</script>
