name: Sync to Gitee

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee https://x-access-token:${{ secrets.GITEE_TOKEN }}@gitee.com/bai-xuedong/medley_of_fun.git
          git push gitee --all
          git push gitee --tags
